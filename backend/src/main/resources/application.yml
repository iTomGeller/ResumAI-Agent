server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: resumai-agent-backend
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:resumai_agent}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:resumai}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  metrics:
    distribution:
      percentiles-histogram:
        resumai.dag.node.duration: true
        resumai.tool.call.duration: true
        resumai.mcp.call.duration: true
        resumai.funnel.time_to_screen: true
        resumai.mysql.query.duration: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

resumai:
  upload-dir: ${UPLOAD_DIR:./uploads}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    api-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    connect-timeout-ms: ${DEEPSEEK_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${DEEPSEEK_READ_TIMEOUT_MS:120000}
  neo4j:
    uri: ${NEO4J_URI:bolt://neo4j:7687}
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:}
  milvus:
    host: ${MILVUS_HOST:milvus}
    port: ${MILVUS_PORT:19530}
    collection: ${MILVUS_COLLECTION:resume_chunk}
    jd-collection: ${MILVUS_JD_COLLECTION:jd_library}
    dimension: ${MILVUS_DIMENSION:0}
  embedding:
    # EXP-1 winner: Bailian text-embedding-v3 (1024-d). Local MiniLM is offline-only.
    provider: ${EMBEDDING_PROVIDER:bailian}
    enabled: ${EMBEDDING_ENABLED:true}
    base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
    model: ${EMBEDDING_MODEL:text-embedding-v3}
    read-timeout-ms: ${EMBEDDING_READ_TIMEOUT_MS:60000}
  kb:
    # EXP-2 chunk grid knobs (winner locked after the grid run)
    chunk-chars: ${KB_CHUNK_CHARS:320}
    overlap-chars: ${KB_OVERLAP_CHARS:60}
  intent:
    # EXP-6: below this LLM confidence the turn degrades to a clarify question
    confidence-floor: ${INTENT_CONFIDENCE_FLOOR:0.7}
  trace:
    langsmith-api-key: ${LANGSMITH_API_KEY:}
    otel-exporter-otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
  mysql:
    observability:
      enabled: true
      slow-query-threshold-ms: ${MYSQL_SLOW_QUERY_THRESHOLD_MS:200}
      table-refresh-interval-ms: ${MYSQL_TABLE_REFRESH_INTERVAL_MS:60000}
      monitored-tables:
        - jd_library
        - resume_task
        - agent_execution_trace
        - llm_invocation
        - human_feedback_log
        - ragas_eval_metrics
        - system_orchestration_rule
  object-storage:
    enabled: ${OBJECT_STORAGE_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ROOT_USER:}
    secret-key: ${MINIO_ROOT_PASSWORD:}
    bucket: ${MINIO_BUCKET:resumai}
    region: us-east-1
  task-queue:
    enabled: ${TASK_QUEUE_ENABLED:true}
    stream-key: resumai:task_queue
    consumer-group: resume-workers
    worker-id: ${TASK_WORKER_ID:worker-1}
    max-workers: ${TASK_QUEUE_MAX_WORKERS:6}
    poll-interval-ms: ${TASK_QUEUE_POLL_MS:500}
    running-timeout-minutes: ${TASK_QUEUE_RUNNING_TIMEOUT_MIN:30}
    max-attempts: ${TASK_QUEUE_MAX_ATTEMPTS:3}
    retry-backoff-seconds: ${TASK_QUEUE_RETRY_BACKOFF_SEC:60}
  workflow:
    mode: ${WORKFLOW_MODE:python}
    base-url: ${WORKFLOW_BASE_URL:http://ai-resume-workflow:8090}
    internal-token: ${WORKFLOW_INTERNAL_TOKEN:change-me}
  agent-run:
    enabled: ${AGENT_RUN_ENABLED:true}
    max-global-concurrent: ${RUN_MAX_GLOBAL_CONCURRENT:4}
    run-timeout-seconds: ${RUN_TIMEOUT_SECONDS:900}
    dispatch-interval-ms: ${RUN_DISPATCH_INTERVAL_MS:500}
    watchdog-interval-ms: ${RUN_WATCHDOG_INTERVAL_MS:15000}
    cancel-grace-seconds: ${RUN_CANCEL_GRACE_SECONDS:90}
    pause-grace-seconds: ${RUN_PAUSE_GRACE_SECONDS:120}
    pause-ttl-seconds: ${RUN_PAUSE_TTL_SECONDS:7200}
    start-grace-seconds: ${RUN_START_GRACE_SECONDS:90}
    permit-lease-minutes: ${RUN_PERMIT_LEASE_MINUTES:30}
    worker-id: ${TASK_WORKER_ID:backend-1}
  policy:
    epsilon: ${POLICY_EPSILON:0.10}
  memory:
    cleanup-interval-ms: ${MEMORY_CLEANUP_INTERVAL_MS:600000}

langfuse:
  otel-endpoint: ${LANGFUSE_OTEL_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:}}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  public-url: ${LANGFUSE_PUBLIC_URL:}

app:
  mcp:
    config-path: ${MCP_CONFIG_PATH:/app/config/mcp-servers.json}
  skills:
    path: ${SKILLS_PATH:/app/skills}
