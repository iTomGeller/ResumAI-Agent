name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the real DeepSeek E2E benchmark (needs a live stack)"
        default: "false"

permissions:
  contents: read

jobs:
  python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workflow requirements
        run: python -m pip install --disable-pip-version-check -r workflow/requirements.txt pytest==8.3.5
      - name: Compile all runtime modules
        run: python -m compileall -q workflow/app
      - name: Compile harness / evolution / seed scripts
        run: |
          python -m py_compile harness/run_agent_e2e_benchmark.py \
            harness/run_policy_contract_benchmark.py \
            harness/run_retrieval_benchmark.py \
            harness/evolve_policies.py \
            scripts/seed_knowledge_base.py
      - name: Legacy runtime must stay deleted
        run: |
          set -e
          legacy_route="/workflow/run""s"
          legacy_module="app.grap""h"
          legacy_registry="default_run_regis""try"
          legacy_entry="run_workflo""w"
          ! grep -R "$legacy_route" --include="*.py" --include="*.java" backend/src workflow/app
          ! grep -R "$legacy_module" --include="*.py" workflow
          ! grep -R "$legacy_registry" --include="*.py" workflow
          ! grep -R "$legacy_entry" --include="*.py" workflow/app
      - name: Runtime unit tests
        run: python -m pytest workflow/tests -q
      - name: Offline agent contract gate
        run: |
          cd workflow
          python run_agent_harness.py
      - name: Policy contract benchmark
        run: python harness/run_policy_contract_benchmark.py --out reports/benchmark/contract
      - name: Upload contract benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-benchmark
          path: reports/benchmark/contract
          if-no-files-found: error

  java-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend tests
        run: mvn -B -f backend/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        run: |
          cat > .env <<'EOF'
          DEEPSEEK_API_KEY=ci-placeholder
          MYSQL_ROOT_PASSWORD=ci
          MYSQL_PASSWORD=ci
          MYSQL_DATABASE=resumai_agent
          MYSQL_USER=resumai
          REDIS_PASSWORD=ci
          NEO4J_AUTH=neo4j/ci-placeholder
          MINIO_ROOT_USER=ci
          MINIO_ROOT_PASSWORD=ci-placeholder
          GRAFANA_PASSWORD=ci-placeholder
          WORKFLOW_INTERNAL_TOKEN=ci-placeholder-token
          SANDBOX_WORKER_TAG=ci
          EOF
          docker compose -f docker-compose.prod.yml config > /dev/null
          legacy_route="workflow/run""s"
          ! docker compose -f docker-compose.prod.yml config | grep -q "$legacy_route"

  # Real DeepSeek E2E quality benchmark: manual release gate only. Requires a
  # reachable deployed stack and spends real tokens — never runs on push.
  real-e2e-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run real agent E2E benchmark
        env:
          BENCH_BASE_URL: ${{ secrets.BENCH_BASE_URL }}
        run: |
          python harness/run_agent_e2e_benchmark.py \
            --base "$BENCH_BASE_URL" --repeats 3 \
            --out reports/benchmark/e2e
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-benchmark
          path: reports/benchmark/e2e
