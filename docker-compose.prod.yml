name: resumai

services:
  ai-resume-backend:
    build:
      context: ./backend
      args:
        SKIP_TESTS: ${SKIP_TESTS:-0}
    container_name: ai-resume-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      SPRING_PROFILES_ACTIVE: prod
      WORKFLOW_BASE_URL: http://ai-resume-workflow:8090
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:?WORKFLOW_INTERNAL_TOKEN must be set}
      WORKFLOW_MODE: python
      RUN_MAX_GLOBAL_CONCURRENT: ${RUN_MAX_GLOBAL_CONCURRENT:-16}
      # Keep uploaded resumes, KB manifests/chunks and file-backed Memory on
      # the named volume below. Relying on the application default (/app/uploads)
      # loses these files whenever the backend container is recreated.
      UPLOAD_DIR: /opt/ai-resume-agent-platform/uploads
      # Real LLM embeddings. Default: Bailian/DashScope text-embedding-v3 —
      # the only remote provider reliably reachable from this ECS (openrouter.ai
      # and api.openai.com are network-unreachable; see EXP-1 notes).
      # EMBEDDING_API_KEY is the provider key — never hard-bound to one vendor.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bailian}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      RESUME_EMBEDDING_DIMENSION: ${RESUME_EMBEDDING_DIMENSION:-1024}
      JD_EMBEDDING_DIMENSION: ${JD_EMBEDDING_DIMENSION:-768}
      KB_EMBEDDING_DIMENSION: ${KB_EMBEDDING_DIMENSION:-768}
      KB_CHUNK_CHARS: ${KB_CHUNK_CHARS:-320}
      KB_OVERLAP_CHARS: ${KB_OVERLAP_CHARS:-0}
    expose:
      - "8080"
    volumes:
      - uploads-data:/opt/ai-resume-agent-platform/uploads
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ai-resume-workflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - resumai-net

  ai-resume-workflow:
    build:
      context: .
      dockerfile: workflow/Dockerfile
      args:
        SKIP_TESTS: ${SKIP_TESTS:-0}
    container_name: ai-resume-workflow
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_QUALITY_MODEL: ${DEEPSEEK_QUALITY_MODEL:-deepseek-v4-pro}
      # Workflow execution and provider calls are the only capacity permits.
      LLM_MAX_CONCURRENT: ${LLM_MAX_CONCURRENT:-48}
      LLM_HTTP_MAX_CONNECTIONS: ${LLM_HTTP_MAX_CONNECTIONS:-64}
      LLM_HTTP_MAX_KEEPALIVE_CONNECTIONS: ${LLM_HTTP_MAX_KEEPALIVE_CONNECTIONS:-32}
      JAVA_BACKEND_URL: http://ai-resume-backend:8080
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:?WORKFLOW_INTERNAL_TOKEN must be set}
      WORKFLOW_BUILD_VERSION: ${WORKFLOW_BUILD_VERSION:-dev}
      CONTEXT_AUDIT_ENABLED: ${CONTEXT_AUDIT_ENABLED:-false}
      LANGGRAPH_RUNTIME_ENABLED: ${LANGGRAPH_RUNTIME_ENABLED:-true}
      LANGGRAPH_CHECKPOINT_DSN: postgresql://resumai:${WORKFLOW_POSTGRES_PASSWORD:?WORKFLOW_POSTGRES_PASSWORD must be set}@langgraph-postgres:5432/resumai_checkpoint?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Runtime still probes tools/list and exposes only servers with a live
      # client; enabling MCP here never promotes DOWN/config-only tools.
      MCP_TOOLS_ENABLED: ${MCP_TOOLS_ENABLED:-1}
      # Production must verify initialize -> tools/list.  Keep this explicit
      # so a stale value in the host .env cannot silently disable all public
      # MCP tools inside the workflow container.
      MCP_SKIP_PROBE: "0"
      # Progressive disclosure is the production default: after signal-based
      # selection the model receives Skill metadata and must call load_skill
      # before the full instructions enter its context.  Eager loading remains
      # an explicit benchmark/debug override only.
      SKILL_EAGER_IDS: ${SKILL_EAGER_IDS:-}
      LLM_STREAM_REPORT_SECTIONS: ${LLM_STREAM_REPORT_SECTIONS:-1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
    expose:
      - "8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      langgraph-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 15 http://127.0.0.1:8090/ready || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 45s
    networks:
      - resumai-net

  langgraph-postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: resumai-langgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resumai_checkpoint
      POSTGRES_USER: resumai
      POSTGRES_PASSWORD: ${WORKFLOW_POSTGRES_PASSWORD:?WORKFLOW_POSTGRES_PASSWORD must be set}
    expose:
      - "5432"
    volumes:
      - langgraph-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumai -d resumai_checkpoint"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - resumai-net

  ai-resume-agent-harness:
    build:
      context: .
      dockerfile: workflow/Dockerfile
    profiles: ["harness"]
    command: ["python", "run_agent_harness.py"]
    restart: "no"
    networks:
      - resumai-net

  ai-resume-frontend:
    build:
      context: ./frontend
    container_name: ai-resume-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      ai-resume-backend:
        condition: service_started
    networks:
      - resumai-net

  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: resumai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - resumai-net

  redis:
    image: docker.m.daocloud.io/library/redis:7.2-alpine
    container_name: resumai-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - resumai-net

  # The knowledge-graph feature was removed (plan item F): Neo4j is now
  # optional (profile "graph"), its data volume stays untouched on disk.
  neo4j:
    image: docker.m.daocloud.io/library/neo4j:5.20-community
    container_name: resumai-neo4j
    restart: unless-stopped
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_default__listen__address: 0.0.0.0
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - resumai-net

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: resumai-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/minio_data", "--console-address", ":9001"]
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - resumai-net

  etcd:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/etcd:3.5.15-0
    container_name: resumai-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    expose:
      - "2379"
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - resumai-net

  milvus:
    image: docker.m.daocloud.io/milvusdb/milvus:v2.4.4
    container_name: resumai-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    expose:
      - "19530"
      - "9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9091/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - resumai-net

networks:
  resumai-net:
    driver: bridge

volumes:
  mysql-data:
    # Reuses the original production volume. Schema evolution is handled by
    # the guarded, versioned migrations in backend/src/main/resources/db/
    # migrations applied automatically at backend startup — never by
    # recreating or renaming this volume.
    name: resumai-mysql-data
  redis-data:
    name: resumai-redis-data
  neo4j-data:
    name: resumai-neo4j-data
  neo4j-logs:
    name: resumai-neo4j-logs
  neo4j-plugins:
    name: resumai-neo4j-plugins
  minio-data:
    name: resumai-minio-data
  etcd-data:
    name: resumai-etcd-data
  milvus-data:
    name: resumai-milvus-data
  uploads-data:
    name: resumai-uploads-data
  backend-logs:
    name: resumai-backend-logs
  langgraph-postgres-data:
    # New volume name deliberately avoids attaching the removed legacy graph's
    # checkpoint schema on existing hosts.
    name: resumai-langgraph-postgres-data
