name: resumai

services:
  ai-resume-backend:
    build:
      context: ./backend
    container_name: ai-resume-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-resumai}
      SPRING_PROFILES_ACTIVE: prod
      LANGFUSE_OTEL_ENDPOINT: ${LANGFUSE_OTEL_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-}
      WORKFLOW_BASE_URL: http://ai-resume-workflow:8090
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:?WORKFLOW_INTERNAL_TOKEN must be set}
      WORKFLOW_MODE: python
      # Real LLM embeddings. Default: Bailian/DashScope text-embedding-v3 —
      # the only remote provider reliably reachable from this ECS (openrouter.ai
      # and api.openai.com are network-unreachable; see EXP-1 notes).
      # EMBEDDING_API_KEY is the provider key — never hard-bound to one vendor.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bailian}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
    expose:
      - "8080"
    volumes:
      - uploads-data:/opt/ai-resume-agent-platform/uploads
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ai-resume-workflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - resumai-net

  ai-resume-workflow:
    build:
      context: .
      dockerfile: workflow/Dockerfile
    container_name: ai-resume-workflow
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_QUALITY_MODEL: ${DEEPSEEK_QUALITY_MODEL:-deepseek-v4-pro}
      JAVA_BACKEND_URL: http://ai-resume-backend:8080
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:?WORKFLOW_INTERNAL_TOKEN must be set}
      WORKFLOW_BUILD_VERSION: ${WORKFLOW_BUILD_VERSION:-dev}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Runtime still probes tools/list and exposes only servers with a live
      # client; enabling MCP here never promotes DOWN/config-only tools.
      MCP_TOOLS_ENABLED: ${MCP_TOOLS_ENABLED:-1}
      # Production must verify initialize -> tools/list.  Keep this explicit
      # so a stale value in the host .env cannot silently disable all public
      # MCP tools inside the workflow container.
      MCP_SKIP_PROBE: "0"
      # EXP-7 replan sensitivity knob (default matches executor fallback)
      REPLAN_CONFIDENCE_THRESHOLD: ${REPLAN_CONFIDENCE_THRESHOLD:-0.55}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      LANGFUSE_OTEL_ENDPOINT: ${LANGFUSE_OTEL_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-}
    expose:
      - "8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 15 http://127.0.0.1:8090/ready || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 45s
    networks:
      - resumai-net

  # The legacy LangGraph checkpoint PostgreSQL was removed with the graph
  # runtime: pause/resume snapshots now live in MySQL (agent_run.execution_
  # snapshot) via the Java control plane. The old volume
  # resumai-workflow-postgres-data is intentionally left on disk untouched.

  ai-resume-agent-harness:
    build:
      context: .
      dockerfile: workflow/Dockerfile
    profiles: ["harness"]
    command: ["python", "run_agent_harness.py"]
    restart: "no"
    networks:
      - resumai-net

  # Policy Lab isolation only — not started with the default production stack.
  # Enable with: docker compose --profile policy-lab up -d
  resumai-sandbox-manager:
    build:
      context: .
      dockerfile: sandbox/manager/Dockerfile
    container_name: resumai-sandbox-manager
    profiles: ["policy-lab"]
    restart: unless-stopped
    user: "1000:1000"
    environment:
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:?WORKFLOW_INTERNAL_TOKEN must be set}
      JAVA_BACKEND_URL: http://ai-resume-backend:8080
      # Pinned per deployment to the exact git commit — never a floating latest.
      SANDBOX_WORKER_IMAGE: resumai-sandbox-worker:${SANDBOX_WORKER_TAG:?SANDBOX_WORKER_TAG must be set to the git sha}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
      SANDBOX_MEM_LIMIT: ${SANDBOX_MEM_LIMIT:-384m}
      SANDBOX_CPU: ${SANDBOX_CPU:-0.5}
      SANDBOX_TTL_SECONDS: ${SANDBOX_TTL_SECONDS:-240}
    expose:
      - "8070"
    volumes:
      # ECS currently runs Docker as root. Prefer rootless when available:
      #   /run/user/1000/docker.sock:/run/user/1000/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - resumai-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8070/health', timeout=4)\" || exit 1"]
      interval: 20s
      timeout: 6s
      retries: 10
      start_period: 15s

  # Runs PolicyExperimentRunner against /api/dev/policy-lab/* — no production
  # MySQL / MinIO credentials injected.
  policy-lab-worker:
    build:
      context: .
      dockerfile: harness/Dockerfile.policy-lab
    profiles: ["policy-lab"]
    container_name: policy-lab-worker
    restart: unless-stopped
    environment:
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:?WORKFLOW_INTERNAL_TOKEN must be set}
      POLICY_LAB_REDIS_STREAM: policy-lab:experiments
      SANDBOX_MANAGER_URL: http://resumai-sandbox-manager:8070
      JAVA_BACKEND_URL: http://ai-resume-backend:8080
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    depends_on:
      resumai-sandbox-manager:
        condition: service_started
    networks:
      - resumai-net

  resumai-sandbox-worker-image:
    # build-only pseudo service: `docker compose --profile build build`
    build:
      context: .
      dockerfile: sandbox/worker/Dockerfile
    image: resumai-sandbox-worker:${SANDBOX_WORKER_TAG:?SANDBOX_WORKER_TAG must be set to the git sha}
    profiles: ["build"]
    command: ["python", "-c", "print('worker image ok')"]
    restart: "no"
    network_mode: "none"

  ai-resume-frontend:
    build:
      context: ./frontend
    container_name: ai-resume-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      ai-resume-backend:
        condition: service_started
    networks:
      - resumai-net

  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: resumai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - resumai-net

  redis:
    image: docker.m.daocloud.io/library/redis:7.2-alpine
    container_name: resumai-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - resumai-net

  # The knowledge-graph feature was removed (plan item F): Neo4j is now
  # optional (profile "graph"), its data volume stays untouched on disk.
  neo4j:
    image: docker.m.daocloud.io/library/neo4j:5.20-community
    container_name: resumai-neo4j
    restart: unless-stopped
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_default__listen__address: 0.0.0.0
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - resumai-net

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: resumai-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/minio_data", "--console-address", ":9001"]
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - resumai-net

  etcd:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/etcd:3.5.15-0
    container_name: resumai-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    expose:
      - "2379"
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - resumai-net

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: resumai-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    expose:
      - "19530"
      - "9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9091/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - resumai-net

  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v2.53.0
    container_name: resumai-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - resumai-net

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:11.1.0
    container_name: resumai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_SERVER_ROOT_URL: http://${PUBLIC_HOST:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - resumai-net

networks:
  resumai-net:
    driver: bridge

volumes:
  mysql-data:
    # Reuses the original production volume. Schema evolution is handled by
    # the guarded, versioned migrations in backend/src/main/resources/db/
    # migrations applied automatically at backend startup — never by
    # recreating or renaming this volume.
    name: resumai-mysql-data
  redis-data:
    name: resumai-redis-data
  neo4j-data:
    name: resumai-neo4j-data
  neo4j-logs:
    name: resumai-neo4j-logs
  neo4j-plugins:
    name: resumai-neo4j-plugins
  minio-data:
    name: resumai-minio-data
  etcd-data:
    name: resumai-etcd-data
  milvus-data:
    name: resumai-milvus-data
  uploads-data:
    name: resumai-uploads-data
  backend-logs:
    name: resumai-backend-logs
  prometheus-data:
    name: resumai-prometheus-data
  grafana-data:
    name: resumai-grafana-data
  # resumai-workflow-postgres-data still exists on the host from the legacy
  # LangGraph checkpoint store. It is no longer mounted by any service and is
  # deliberately not deleted (no volume is ever pruned by deployment).
