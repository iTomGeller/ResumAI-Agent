<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">最新100份压测时延分位数</title>
  <desc id="desc">上传时延以毫秒显示，队列等待、Runtime、端到端以秒显示，分别对比 P50、P95、P99。</desc>
  <style>
    .title{font:700 34px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#10233f}
    .subtitle{font:20px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#5a6b84}
    .head{font:700 23px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#10233f}
    .label{font:20px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#1b304e}
    .small{font:17px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#607089}
    .value{font:700 18px 'Segoe UI',sans-serif;fill:#10233f}
  </style>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text class="title" x="50" y="55">最新100份：上传很快，E2E 长尾主要来自排队</text>
  <text class="subtitle" x="50" y="88">不同单位拆成两个面板，避免对数轴把毫秒与分钟混在一起</text>

  <rect x="45" y="120" width="1110" height="185" rx="16" fill="#f5f8fc" stroke="#d3dce8"/>
  <text class="head" x="75" y="158">上传 API｜毫秒</text>
  <text class="label" x="75" y="202">P50</text><rect x="160" y="184" width="247" height="24" rx="5" fill="#2f67e8"/><text class="value" x="420" y="203">34.5ms</text>
  <text class="label" x="75" y="242">P95</text><rect x="160" y="224" width="523" height="24" rx="5" fill="#df8c24"/><text class="value" x="696" y="243">73.2ms</text>
  <text class="label" x="75" y="282">P99</text><rect x="160" y="264" width="915" height="24" rx="5" fill="#7a45d8"/><text class="value" x="1088" y="283">128.1ms</text>

  <rect x="45" y="335" width="1110" height="360" rx="16" fill="#f5f8fc" stroke="#d3dce8"/>
  <text class="head" x="75" y="375">Queue / Runtime / E2E｜秒</text>
  <text class="small" x="810" y="375">P50　</text><rect x="860" y="359" width="18" height="18" rx="3" fill="#2f67e8"/>
  <text class="small" x="900" y="375">P95　</text><rect x="950" y="359" width="18" height="18" rx="3" fill="#df8c24"/>
  <text class="small" x="990" y="375">P99　</text><rect x="1040" y="359" width="18" height="18" rx="3" fill="#7a45d8"/>

  <text class="label" x="75" y="438">Queue wait</text>
  <rect x="235" y="405" width="358" height="20" rx="4" fill="#2f67e8"/><text class="value" x="604" y="422">159.2</text>
  <rect x="235" y="435" width="691" height="20" rx="4" fill="#df8c24"/><text class="value" x="937" y="452">307.3</text>
  <rect x="235" y="465" width="744" height="20" rx="4" fill="#7a45d8"/><text class="value" x="990" y="482">330.7</text>

  <text class="label" x="75" y="548">Runtime</text>
  <rect x="235" y="515" width="134" height="20" rx="4" fill="#2f67e8"/><text class="value" x="380" y="532">59.4</text>
  <rect x="235" y="545" width="190" height="20" rx="4" fill="#df8c24"/><text class="value" x="436" y="562">84.6</text>
  <rect x="235" y="575" width="203" height="20" rx="4" fill="#7a45d8"/><text class="value" x="449" y="592">90.1</text>

  <text class="label" x="75" y="658">End-to-end</text>
  <rect x="235" y="625" width="513" height="20" rx="4" fill="#2f67e8"/><text class="value" x="759" y="642">228.0</text>
  <rect x="235" y="655" width="834" height="20" rx="4" fill="#df8c24"/><text class="value" x="1080" y="672">370.5</text>
  <rect x="235" y="685" width="878" height="20" rx="4" fill="#7a45d8"/><text class="value" x="1124" y="702">390.0</text>

  <text class="small" x="600" y="738" text-anchor="middle">E2E ≈ Queue wait + Runtime；Graph boundary P95 仅 119.05ms，不是分钟级长尾来源</text>
</svg>
